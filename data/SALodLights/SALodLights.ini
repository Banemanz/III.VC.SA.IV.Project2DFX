[LodLights]
RenderLodLights = 1
MaxNumberOfLodLights = 25000
CoronaRadiusMultiplier = 0.5
SlightlyIncreaseRadiusWithDistance = 1
CoronaAlphaNearMinMult = 0.5             ; alpha multiplier for nearby coronas 
CoronaAlphaReachOneAt = 150.0            ; distance where alpha multiplier reaches 1.0
CoronaAlphaBoostStartAt = 150.0          ; start boosting after this
CoronaAlphaFarBoostMax = 4.0             ; max boost for distant coronas
CoronaFarClip = auto
WeatherCoronaFarClipMultipliers = 1.00,1.00,0.70,0.70,0.80,0.80,0.65,0.65,0.55,0.55,0.85,0.85,0.90,0.90,0.90,0.90,0.80,0.80,0.75,0.75,0.65,0.65,1.00
                                             ; 23 comma-separated SA weather multipliers for CoronaFarClip.
                                             ; 1.0 = unchanged, below 1.0 = reduce during expensive fog/rain/sand,
                                             ; above 1.0 = add distance for that weather. Interpolates between old/new weather.
ExcludeNoDistanceGroundInWeathers = 8,9,16,17,20,21
                                             ; Weather IDs where no-distance/min-draw-distance ground coronas are skipped.
                                             ; Use "*" for all weathers or leave blank for none.
NoDistanceGroundExcludeHeight = 2.5       ; Lights within this many metres of ground are considered ground coronas.
MaxNumberOfDistantCars = 2000
DistantCarsRadiusMultiplier = 1.0

[StaticShadows]
StaticShadowsIntensity = 2.0
StaticShadowsDrawDistance = 200.0

[SearchLights]
RenderSearchlightEffects = 1
RenderOnlyDuringFoggyWeather = 0
SearchlightEffectVisibilityFactor = 0.4

[FarClip]
FarClipMultiplier = 0                    ; 0 = dynamic, any other value = fixed multiplier (e.g. 5.0)
HeightFactor = 0.05
MinMultiplier = 2.0
MaxMultiplier = 4.0
TargetFPS = 60
StaticSunSize = 20.0

[IDETweaker]
TimedObjectsDrawDistance = 0.0           ; All values below 10.0 will be used as a multiplier, otherwise as a draw distance.
LODObjectsDrawDistance = 1300.0
GenericObjectsDrawDistance = 300.0
AllNormalObjectsDrawDistance = 0.0
VegetationDrawDistance = 800.0
PreloadLODs = 1

[EngineBarriers]
; Reference notes for tuning beyond SA limits. These are documentation-only:
; - Corona buffer pressure: raise MaxNumberOfLodLights only as far as needed.
;   When full, the plugin keeps closer coronas and drops farther ones.
; - Far clip and IDE draw distance multiply world streaming, culling, fog, and alpha work.
;   Prefer WeatherCoronaFarClipMultipliers to pull fog/rain/sand back instead of brute force.
; - Ground no-distance/min-draw-distance lights are expensive because they never naturally cull.
;   Use ExcludeNoDistanceGroundInWeathers for heavy weather presets.
; - GenericObjectsDrawDistance/VegetationDrawDistance can force lots of normal entities through
;   SA renderer sectors. Keep them lower than LODObjectsDrawDistance unless you need close detail.
; - PreloadLODs can smooth popping, but it increases memory pressure and load bursts.
